services:
  # Redis - Celery Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: celery-redis
    ports: 
      - "6379:6379"
    networks:
      - celery-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI 应用
  api:
    build: .
    container_name: celery-api
    command: >
      bash -c "
      python -m app.api.server
      "
    ports:
      - "8000:8000"
    volumes:
      # 将宿主机（Windows）上的目录映射到容器内的 /root/code/simu_service
      # 在 WSL 中，Windows 的 C: 驱动器路径通常挂载在 /mnt/c
      - /mnt/c/Users/qlab/Desktop/KQCircuits/batch_tools/simu_service:/root/code/simu_service
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - celery-net
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

  # 注意: Worker 已移至主机运行，不再作为容器服务

  # Flower - Celery 监控工具
  flower:
    build: .
    container_name: celery-flower
    command: >
      bash -c "
      celery -A app.config.flower_config.celery_app flower --port=5555
      "
    ports:
      - "5555:5555"
    volumes:
      - flower-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - celery-net
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

networks:
  celery-net:
    driver: bridge

volumes:
  flower-data:
